<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <title>HEX for opencode</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('opencode.settings.theme.v1') === 'light' ? 'light' : 'dark';
      } catch {}
    </script>
    <script type="module" src="./main.ts"></script>
    <style>
      html,
      body,
      #app {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020617;
      }
      html[data-theme='light'] body,
      html[data-theme='light'] #app {
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
